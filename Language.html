<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f4f9;
      text-align: center;
    }
    textarea, select, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fff;
      min-height: 50px;
      display: inline-block;
      width: 60%;
    }
  </style>
</head>
<body>
  <h2>🌍 Language Translator Tool</h2>

  <textarea id="inputText" rows="4" cols="50" placeholder="Enter text here..."></textarea><br>

  From: 
  <select id="sourceLang">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
  </select>

  To: 
  <select id="targetLang">
    <option value="hi">Hindi</option>
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
  </select><br>

  <button onclick="translateText()">Translate</button>
  <button onclick="copyText()">Copy</button>
 

  <div id="result"></div>

  <script>
    async function translateText() {
      const text = document.getElementById("inputText").value;
      const source = document.getElementById("sourceLang").value;
      const target = document.getElementById("targetLang").value;

      if (!text) {
        alert("Please enter text to translate!");
        return;
      }

      const res = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`
      );
      const data = await res.json();
      document.getElementById("result").innerText = data.responseData.translatedText;
    }

    function copyText() {
      const result = document.getElementById("result").innerText;
      navigator.clipboard.writeText(result);
      alert("Text copied!");
    }

    function speakText() {
      const result = document.getElementById("result").innerText;
      if (!result) {
        alert("Nothing to speak!");
        return;
      }
      const utterance = new SpeechSynthesisUtterance(result);
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
